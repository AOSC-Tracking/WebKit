<!doctype html>
<meta charset="utf-8">
<title>:host and :not</title>
<link rel="help" href="https://drafts.csswg.org/selectors/#featureless">
<link rel="match" href="/css/reference/ref-filled-green-100px-square-only.html">
<p>Test passes if there is a filled green square.</p>
<div id="host"></div>
<script>
  host.attachShadow({mode: "open"}).innerHTML = `
    <style>
      :is(:host) #specific {
        width: 100px;
        height: 100px;
        background-color: green;
      }
      :not(:host):not(#middle) #specific {
        background-color: red;
      }
      :is(:not(:host):not(#middle)) #specific {
        background-color: red;
      }
      :is(:not(host),#middle) #specific {
        background-color: red;
      }
    </style>
    <div id="middle"><div id="specific"></div></div>
  `;
</script>
